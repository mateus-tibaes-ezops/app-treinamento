name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::618889059366:role/app-treinamento-dev-github-actions
  ECR_REPOSITORY: 618889059366.dkr.ecr.us-east-1.amazonaws.com/app-treinamento-dev-backend
  ECS_CLUSTER: app-treinamento-dev
  ECS_SERVICE: app-treinamento-dev-backend
  FRONTEND_BUCKET: app-treinamento-dev-frontend-618889059366
  CLOUDFRONT_DISTRIBUTION_ID: E2B8XKFPEJ6A73
  API_URL: https://app-treinamento-mateus.ezopscloud.co/api
  FRONTEND_URL: https://app-treinamento-mateus.ezopscloud.co

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build --platform linux/amd64 -t "$ECR_REPOSITORY:latest" ./backend
          docker push "$ECR_REPOSITORY:latest"

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Prepare frontend files
        run: |
          mkdir -p /tmp/app-treinamento-frontend
          cp -R frontend/. /tmp/app-treinamento-frontend/
          rm -f /tmp/app-treinamento-frontend/Dockerfile
          rm -f /tmp/app-treinamento-frontend/nginx.conf
          rm -f /tmp/app-treinamento-frontend/.dockerignore
          cat > /tmp/app-treinamento-frontend/config.js <<CONFIG
          window.API_BASE_URL = "$API_URL";
          CONFIG

      - name: Upload frontend
        run: aws s3 sync /tmp/app-treinamento-frontend/ "s3://$FRONTEND_BUCKET" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: Smoke test
        run: curl --fail --silent "$FRONTEND_URL/api/health"
