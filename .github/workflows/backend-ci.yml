name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::618889059366:role/app-treinamento-dev-github-actions
  ECR_REPOSITORY: 618889059366.dkr.ecr.us-east-1.amazonaws.com/app-treinamento-dev-backend
  ECS_CLUSTER: app-treinamento-dev
  ECS_SERVICE: app-treinamento-dev-backend

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Syntax check
        working-directory: backend
        run: node --check server.js

      - name: Build Docker image
        run: docker build -t app-treinamento-backend:${GITHUB_SHA} ./backend

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag app-treinamento-backend:${GITHUB_SHA} "$ECR_REPOSITORY:${GITHUB_SHA}"
          docker tag app-treinamento-backend:${GITHUB_SHA} "$ECR_REPOSITORY:latest"
          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy backend to ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
